name: Luna APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --stacktrace -PLUNA_BACKEND_URL="${{ secrets.LUNA_BACKEND_URL }}"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Assistant-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
