name: Luna APK bauen

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-Modell-Vorschau
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Emulator beschleunigen
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Luna im Emulator starten und fotografieren
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant de.luna.assistant.v18 android.permission.POST_NOTIFICATIONS
            adb shell am start -n de.luna.assistant.v18/de.luna.assistant.MainActivity
            sleep 6
            mkdir -p preview
            adb shell screencap -p /sdcard/luna-main.png
            adb pull /sdcard/luna-main.png preview/luna-main.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Luna-Bildschirmansicht
          path: preview/luna-main.png
          if-no-files-found: warn
          retention-days: 7
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Dauerhaften Signaturschlüssel vorbereiten
        env:
          LUNA_KEYSTORE_BASE64: ${{ secrets.LUNA_KEYSTORE_BASE64 }}
        run: |
          test -n "$LUNA_KEYSTORE_BASE64"
          printf '%s' "$LUNA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luna-release.jks"

      - name: Signierte APK bauen
        env:
          LUNA_KEYSTORE_PATH: ${{ runner.temp }}/luna-release.jks
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace -PLUNA_BACKEND_URL="${{ secrets.LUNA_BACKEND_URL }}"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Assistant-v1-debug-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
